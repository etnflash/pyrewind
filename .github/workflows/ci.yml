name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: 설치 (표준 라이브러리만 사용하는 도구 + 테스트 도구)
        run: python -m pip install -e ".[dev]"
      - name: 라이브러리 설치 (pandas / sklearn 등, 실패해도 계속 - 해당 테스트는 건너뜀)
        continue-on-error: true
        run: python -m pip install -e ".[examples]"
      - name: 테스트
        run: python -m pytest -q -rs

  extension:
    name: VS Code 확장 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: 확장 테스트 (가짜 vscode API + 실제 파이썬 트레이서)
        run: node vscode-extension/test/extension.test.js
        env:
          VCR_PYTHON: python
      - name: .vsix 패키지 만들기
        run: python build_vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
