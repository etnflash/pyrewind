[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrewind"
version = "0.2.0"
description = "PyRewind — 파이썬 코드를 한 줄씩 앞뒤로 되감으며 변수가 바뀌는 과정을 봅니다 (.py / .ipynb)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["python", "education", "visualization", "debugging", "jupyter", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 예제 노트북과 라이브러리 테스트용
examples = ["pandas", "numpy", "matplotlib", "scikit-learn", "scipy", "seaborn", "pillow", "plotly"]

[project.scripts]
pyrewind = "pyrewind.__main__:main"

[tool.setuptools]
packages = ["pyrewind"]

[tool.setuptools.package-data]
pyrewind = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
