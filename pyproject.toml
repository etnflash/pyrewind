[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-code-runner"
version = "0.1.5"
description = "파이썬 코드가 한 줄씩 실행되며 변수가 만들어지고 바뀌는 과정을 시각화합니다 (.py / .ipynb)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["python", "education", "visualization", "debugging", "jupyter", "pandas"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 예제 노트북과 라이브러리 테스트용
examples = ["pandas", "numpy", "matplotlib", "scikit-learn"]

[project.scripts]
vcr = "visual_code_runner.__main__:main"

[tool.setuptools]
packages = ["visual_code_runner"]

[tool.setuptools.package-data]
visual_code_runner = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
